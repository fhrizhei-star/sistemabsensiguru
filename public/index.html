<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Guru & Tenaga Pendidik</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 15% 15%, #d1fae5 0%, #ecfdf5 35%, #f4fbf7 75%, #e6f7ef 100%);
      position: relative;
      overflow: hidden;
    }

    /* Floating subtle background orbs */
    .login-wrapper::before,
    .login-wrapper::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    .login-wrapper::before {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #34d399, #10b981);
      top: -60px;
      left: -60px;
    }

    .login-wrapper::after {
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, #a7f3d0, #6ee7b7);
      bottom: -80px;
      right: -80px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 45px -10px rgba(6, 43, 33, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      border: 1px solid rgba(209, 250, 229, 0.8);
      padding: 2.5rem 2rem;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 575.98px) {
      .login-wrapper {
        padding: 1rem;
      }

      .login-card {
        padding: 2rem 1.25rem;
        border-radius: var(--radius-lg);
      }
    }

    .brand-logo-badge {
      width: 84px;
      height: 84px;
      background: #ffffff;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 12px 24px -6px rgba(16, 185, 129, 0.22);
      border: 2px solid rgba(16, 185, 129, 0.2);
      padding: 6px;
      overflow: hidden;
    }

    .brand-logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .login-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.65rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .quick-login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
    }

    .quick-btn {
      padding: 0.75rem 0.5rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: #fbfdfc;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      transition: var(--transition);
    }

    .quick-btn:hover {
      background: var(--primary-light);
      border-color: var(--brand-mint);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }

    .database-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #f0fdf4;
      border: 1px solid #d1fae5;
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      color: #065f46;
      margin-top: 1.25rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-wrapper input {
      padding-right: 2.75rem;
    }

    .btn-toggle-password {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.35rem 0.5rem;
      font-size: 1.15rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .btn-toggle-password:hover {
      color: var(--primary);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-main);
      user-select: none;
      font-weight: 500;
    }

    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="text-center">
        <div class="brand-logo-badge">
          <img src="/img/logo.png" alt="Logo Sekolah" id="login-school-logo">
        </div>
        <h1 class="login-title">SIMASEI</h1>
        <p class="text-muted text-sm" style="margin-bottom: 1.75rem; font-weight: 500;">Portal Presensi Guru & Tenaga
          Kependidikan</p>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-username">NIP / Username</label>
          <input type="text" id="login-username" class="form-control" placeholder="Masukkan NIP atau username Anda"
            required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="Masukkan password Anda"
              required autocomplete="current-password">
            <button type="button" id="btn-toggle-password" class="btn-toggle-password"
              title="Tampilkan / Sembunyikan Password" aria-label="Lihat Password">
              <i class="bi bi-eye-slash-fill" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label" for="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <span>Ingat Saya</span>
          </label>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
          Masuk ke Portal
        </button>

        <div style="margin-top: 1rem; text-align: center;">
          <p class="text-sm text-muted" style="margin: 0;">
            Belum punya akun?
            <button type="button" id="btn-open-register"
              style="background: none; border: none; color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0.2rem 0.4rem;">
              <i class="bi bi-person-plus-fill"></i> Buat Akun Guru
            </button>
          </p>
        </div>
      </form>

      <div class="text-center" style="margin-top: 1.5rem;">
        <div class="database-status-pill">
          <span class="status-dot"></span>
          <span>Sistem Presensi Online Aktif</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Pendaftaran Akun Guru Mandiri -->
  <div id="modal-register" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" style="display: flex; align-items: center; gap: 0.6rem;">
          <i class="bi bi-mortarboard-fill text-primary" style="font-size: 1.35rem;"></i>
          <span>Pendaftaran Akun Guru / Staf</span>
        </h3>
        <button class="modal-close" id="btn-close-register" type="button" aria-label="Tutup Modal">&times;</button>
      </div>
      <form id="form-register">
        <div class="modal-body" style="padding: 1.5rem;">

          <!-- Unggah Pasfoto Profil -->
          <div class="form-group text-center" style="margin-bottom: 1.5rem;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
              <div id="reg-foto-preview-container"
                style="width: 86px; height: 86px; border-radius: 50%; border: 3px solid #a7f3d0; background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 6px 14px rgba(16, 185, 129, 0.2); position: relative;">
                <img id="reg-img-preview" src="" alt="Preview Foto"
                  style="width: 100%; height: 100%; object-fit: cover; display: none;">
                <i id="reg-icon-preview" class="bi bi-person-bounding-box"
                  style="font-size: 2.25rem; color: #059669;"></i>
              </div>
              <label for="reg-foto-file" class="btn btn-sm btn-outline"
                style="cursor: pointer; font-size: 0.78rem; padding: 0.35rem 0.95rem; border-radius: var(--radius-full); font-weight: 600;">
                <i class="bi bi-camera-fill"></i> Pilih Pasfoto Guru
              </label>
              <input type="file" id="reg-foto-file" accept="image/*" style="display: none;">
              <input type="hidden" id="reg-foto-base64">
              <span class="text-xs text-muted">Format: JPG, PNG (Maks 2MB, otomatis tersimpan ke Google Drive)</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-nip">Nomor Induk Pegawai (NIP / NUPTK / Peg. ID)</label>
            <input type="text" id="reg-nip" class="form-control" placeholder="Contoh: 198501152010011002" required>
            <span class="text-xs text-muted">NIP ini nantinya digunakan sebagai Username saat login.</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-nama">Nama Lengkap & Gelar</label>
            <input type="text" id="reg-nama" class="form-control" placeholder="Contoh: Drs. Bambang Sudarsono, M.Pd"
              required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-mapel-select">Mata Pelajaran yang Diampu</label>
            <select id="reg-mapel-select" class="form-control" required>
              <option value="">-- Pilih Mata Pelajaran --</option>
              <option value="-">- (Bukan Guru Mapel / Staf Tata Usaha)</option>
              <option value="Al-Qur'an Hadits">Al-Qur'an Hadits</option>
              <option value="Akidah Akhlak">Akidah Akhlak</option>
              <option value="Fikih">Fikih</option>
              <option value="Sejarah Kebudayaan Islam (SKI)">Sejarah Kebudayaan Islam (SKI)</option>
              <option value="Bahasa Arab">Bahasa Arab</option>
              <option value="Bahasa Indonesia">Bahasa Indonesia</option>
              <option value="Bahasa Inggris">Bahasa Inggris</option>
              <option value="Matematika">Matematika</option>
              <option value="Ilmu Pengetahuan Alam (IPA)">Ilmu Pengetahuan Alam (IPA)</option>
              <option value="Ilmu Pengetahuan Sosial (IPS)">Ilmu Pengetahuan Sosial (IPS)</option>
              <option value="Pendidikan Pancasila / PKn">Pendidikan Pancasila / PKn</option>
              <option value="Informatika / TIK">Informatika / TIK</option>
              <option value="Pendidikan Jasmani & Olahraga (PJOK)">Pendidikan Jasmani & Olahraga (PJOK)</option>
              <option value="Seni Budaya & Prakarya">Seni Budaya & Prakarya</option>
              <option value="Bimbingan Konseling (BK)">Bimbingan Konseling (BK)</option>
              <option value="Muatan Lokal">Muatan Lokal</option>
              <option value="Lainnya">Lainnya (Ketik Manual)...</option>
            </select>
            <input type="text" id="reg-mapel-custom" class="form-control" placeholder="Tuliskan nama mata pelajaran..."
              style="display: none; margin-top: 0.5rem;">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-jabatan">Tugas Tambahan / Golongan (Opsional)</label>
            <input type="text" id="reg-jabatan" class="form-control" placeholder="Contoh: Guru Pengajar / Wali Kelas">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label class="form-label" for="reg-password">Buat Password Baru</label>
              <input type="password" id="reg-password" class="form-control" placeholder="Minimal 6 karakter" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-nohp">Nomor WhatsApp Aktif</label>
              <input type="tel" id="reg-nohp" class="form-control" placeholder="Contoh: 08123456789">
            </div>
          </div>

          <div
            style="background: #f0fdf4; border: 1px solid #d1fae5; border-radius: var(--radius-md); padding: 0.5rem; font-size: 0.78rem; color: #065f46; display: flex; align-items: flex-start; gap: 0.5rem; margin-top: 0.5rem;">
            <i class="bi bi-shield-check" style="font-size: 1.15rem; color: #059669; flex-shrink: 0;"></i>
            <span>Akun akan otomatis didaftarkan ke sistem.</span>
          </div>
        </div>

        <div class="modal-footer"
          style="padding: 1.25rem 1.5rem; background: #fafdfb; border-top: 1px solid #eef6f2; display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" class="btn btn-secondary" id="btn-cancel-register">Batal</button>
          <button type="submit" id="btn-submit-register" class="btn btn-primary"
            style="padding: 0.65rem 1.35rem; font-weight: 700;">
            <i class="bi bi-check-circle-fill"></i> Daftarkan Akun Guru
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/mockData.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const currentUser = Auth.getCurrentUser();
      if (currentUser) {
        if (currentUser.role === "admin") {
          window.location.href = "/admin/index.html";
        } else {
          window.location.href = "/user/index.html";
        }
        return;
      }

      const form = document.getElementById("form-login");
      const btnSubmit = document.getElementById("btn-submit-login");
      const userInput = document.getElementById("login-username");
      const passInput = document.getElementById("login-password");
      const rememberCheckbox = document.getElementById("remember-me");
      const btnTogglePassword = document.getElementById("btn-toggle-password");
      const passwordToggleIcon = document.getElementById("password-toggle-icon");

      // Fitur Tampilkan / Sembunyikan Password
      if (btnTogglePassword && passInput) {
        btnTogglePassword.addEventListener("click", () => {
          const isPassword = passInput.type === "password";
          passInput.type = isPassword ? "text" : "password";
          passwordToggleIcon.className = isPassword ? "bi bi-eye-fill" : "bi bi-eye-slash-fill";
        });
      }

      // Isi otomatis NIP/Username dan Password jika sebelumnya dicentang Ingat Saya
      const savedUsername = localStorage.getItem("REMEMBERED_LOGIN_USERNAME");
      const savedPassword = localStorage.getItem("REMEMBERED_LOGIN_PASSWORD");
      if (savedUsername) {
        userInput.value = savedUsername;
      }
      if (savedPassword) {
        passInput.value = savedPassword;
      }
      if (savedUsername || savedPassword) {
        if (rememberCheckbox) rememberCheckbox.checked = true;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = userInput.value.trim();
        const password = passInput.value.trim();
        const rememberMe = rememberCheckbox ? rememberCheckbox.checked : true;

        if (!username || !password) {
          Utils.showToast("NIP/Username dan Password wajib diisi!", "warning");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Memverifikasi...";

        try {
          const res = await Api.login(username, password);
          if (res.success && res.user) {
            // Simpan status Ingat Saya (Username & Password)
            if (rememberMe) {
              localStorage.setItem("REMEMBERED_LOGIN_USERNAME", username);
              localStorage.setItem("REMEMBERED_LOGIN_PASSWORD", password);
            } else {
              localStorage.removeItem("REMEMBERED_LOGIN_USERNAME");
              localStorage.removeItem("REMEMBERED_LOGIN_PASSWORD");
            }

            Auth.setCurrentUser(res.user, rememberMe);
            Utils.showToast(`Selamat datang, ${res.user.nama}!`, "success");

            setTimeout(() => {
              if (res.user.role === "admin") {
                window.location.href = "/admin/index.html";
              } else {
                window.location.href = "/user/index.html";
              }
            }, 500);
          } else {
            Utils.showToast(res.message || "NIP/Username atau password salah!", "error");
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Masuk ke Portal";
          }
        } catch (err) {
          console.error(err);
          Utils.showToast("Terjadi kesalahan koneksi", "error");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Masuk ke Portal";
        }
      });

      // ==================== PENDAFTARAN AKUN GURU MANDIRI ==================== //
      const modalRegister = document.getElementById("modal-register");
      const btnOpenRegister = document.getElementById("btn-open-register");
      const btnCloseRegister = document.getElementById("btn-close-register");
      const btnCancelRegister = document.getElementById("btn-cancel-register");
      const formRegister = document.getElementById("form-register");
      const btnSubmitRegister = document.getElementById("btn-submit-register");

      const regFotoFile = document.getElementById("reg-foto-file");
      const regFotoBase64 = document.getElementById("reg-foto-base64");
      const regImgPreview = document.getElementById("reg-img-preview");
      const regIconPreview = document.getElementById("reg-icon-preview");

      const regMapelSelect = document.getElementById("reg-mapel-select");
      const regMapelCustom = document.getElementById("reg-mapel-custom");

      // Buka Modal
      if (btnOpenRegister && modalRegister) {
        btnOpenRegister.addEventListener("click", () => {
          formRegister.reset();
          regFotoBase64.value = "";
          regImgPreview.src = "";
          regImgPreview.style.display = "none";
          regIconPreview.style.display = "block";
          if (regMapelCustom) {
            regMapelCustom.style.display = "none";
            regMapelCustom.value = "";
          }
          modalRegister.classList.add("active");
        });
      }

      // Tutup Modal
      const closeRegisterModal = () => {
        if (modalRegister) modalRegister.classList.remove("active");
      };
      if (btnCloseRegister) btnCloseRegister.addEventListener("click", closeRegisterModal);
      if (btnCancelRegister) btnCancelRegister.addEventListener("click", closeRegisterModal);

      // Mapel Dropdown "Lainnya" trigger
      if (regMapelSelect && regMapelCustom) {
        regMapelSelect.addEventListener("change", () => {
          if (regMapelSelect.value === "Lainnya") {
            regMapelCustom.style.display = "block";
            regMapelCustom.focus();
          } else {
            regMapelCustom.style.display = "none";
            regMapelCustom.value = "";
          }
        });
      }

      // Upload & Preview Pasfoto Guru
      if (regFotoFile) {
        regFotoFile.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;

          if (file.size > 2 * 1024 * 1024) {
            Utils.showToast("Ukuran foto maksimal 2MB!", "warning");
            return;
          }

          const reader = new FileReader();
          reader.onload = (event) => {
            const base64 = event.target.result;
            regFotoBase64.value = base64;
            regImgPreview.src = base64;
            regImgPreview.style.display = "block";
            regIconPreview.style.display = "none";
          };
          reader.readAsDataURL(file);
        });
      }

      // Submit Pendaftaran Akun Guru
      if (formRegister) {
        formRegister.addEventListener("submit", async (e) => {
          e.preventDefault();

          const nip = document.getElementById("reg-nip").value.trim();
          const nama = document.getElementById("reg-nama").value.trim();
          const password = document.getElementById("reg-password").value.trim();
          const jabatan = document.getElementById("reg-jabatan").value.trim() || "Guru Pengajar";
          const no_hp = document.getElementById("reg-nohp").value.trim() || "-";
          const foto = regFotoBase64 ? regFotoBase64.value : "";

          if (!nip || !nama || !password) {
            Utils.showToast("NIP, Nama Lengkap, dan Password wajib diisi!", "warning");
            return;
          }

          if (password.length < 6) {
            Utils.showToast("Password minimal 6 karakter!", "warning");
            return;
          }

          let mapel = "-";
          if (regMapelSelect) {
            if (regMapelSelect.value === "Lainnya") {
              mapel = regMapelCustom && regMapelCustom.value.trim() ? regMapelCustom.value.trim() : "Lainnya";
            } else {
              mapel = regMapelSelect.value || "-";
            }
          }

          btnSubmitRegister.disabled = true;
          btnSubmitRegister.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Mendaftarkan...`;

          try {
            const payload = {
              username: nip,
              nip: nip,
              nama: nama,
              password: password,
              role: "guru",
              jabatan: jabatan,
              mapel: mapel,
              no_hp: no_hp,
              email: "-",
              foto: foto
            };

            const res = await Api.saveUser(payload);
            if (res.success) {
              Utils.showToast("Akun Guru berhasil didaftarkan! Mengalihkan ke portal...", "success");
              closeRegisterModal();

              // Langsung isi form login dan simpan sesi
              userInput.value = nip;
              passInput.value = password;

              // Otomatis login akun baru
              setTimeout(async () => {
                const loginRes = await Api.login(nip, password);
                if (loginRes.success && loginRes.user) {
                  Auth.setCurrentUser(loginRes.user, true);
                  window.location.href = "/user/index.html";
                } else {
                  Utils.showToast("Silakan klik Masuk ke Portal dengan akun baru Anda.", "info");
                  btnSubmitRegister.disabled = false;
                  btnSubmitRegister.innerHTML = `<i class="bi bi-check-circle-fill"></i> Daftarkan Akun Guru`;
                }
              }, 600);
            } else {
              Utils.showToast(res.message || "Gagal membuat akun guru", "error");
              btnSubmitRegister.disabled = false;
              btnSubmitRegister.innerHTML = `<i class="bi bi-check-circle-fill"></i> Daftarkan Akun Guru`;
            }
          } catch (err) {
            console.error(err);
            Utils.showToast("Terjadi gangguan koneksi saat mendaftarkan akun", "error");
            btnSubmitRegister.disabled = false;
            btnSubmitRegister.innerHTML = `<i class="bi bi-check-circle-fill"></i> Daftarkan Akun Guru`;
          }
        });
      }
    });
  </script>
</body>

</html>
